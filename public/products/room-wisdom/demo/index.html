 1 B prop (same or overlapping); LLM-judged"}, {"part": "end_to_end", "metric": "share_A_matched_same", "value": 0.7619, "band": null, "note": "A props matched as 'same'; LLM-judged"}, {"part": "end_to_end", "metric": "share_B_matched", "value": 0.95, "band": null, "note": "B props matched to an A prop; LLM-judged"}, {"part": "end_to_end", "metric": "n_pairs", "value": 114, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "exact_match_rate", "value": 0.9386, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "expressed_match_rate", "value": 0.9825, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "n_both_expressed", "value": 75, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "direction_match_rate", "value": 0.9333, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "direction_compatible_rate", "value": 1.0, "band": null, "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "kappa", "value": 0.915, "band": "good", "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "alpha_nominal", "value": 0.9153, "band": "good", "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "alpha_ordinal", "value": 0.9386, "band": "good", "note": "matched pairs, A stances on prop_a vs B stances on prop_b"}, {"part": "end_to_end", "metric": "label_match_rate", "value": 0.8421, "band": null, "note": "matched pairs"}]}, "verification": {"units_checked": 122, "units_failed": 0, "report_checked": 54, "report_failed": 0}, "units": {"DEMO02-U0001": {"p": "P01", "q": "I cycle in, every day, unless it's really pouring.", "c": "Cycles into the centre daily except in heavy rain.", "t": "TP01", "s": 0, "w": 9, "ts": 38, "codes": ["OTHER"]}, "DEMO02-U0002": {"p": "P02", "q": "I drive in, because I bring stock for the shop.", "c": "Drives into the centre to bring stock to the café.", "t": "TP01", "s": 0, "w": 10, "ts": 46, "codes": ["TH03.C03"]}, "DEMO02-U0003": {"p": "P03", "q": "I drive. At eleven at night I don't have another option.", "c": "Drives because there is no alternative at night after shifts.", "t": "TP01", "s": -1, "w": 11, "ts": 59, "codes": ["TH01.C03", "TH03.C02"]}, "DEMO02-U0004": {"p": "P04", "q": "I live two streets from the market and I walk everywhere. With a stick these days [laughter].", "c": "Walks everywhere, now with a stick.", "t": "TP01", "s": 0, "w": 16, "ts": 72, "codes": ["OTHER"]}, "DEMO02-U0005": {"p": "P05", "q": "I take the bus from the student halls. When it turns up.", "c": "Takes the bus, which is unreliable.", "t": "TP01", "s": -1, "w": 12, "ts": 83, "codes": ["TH01.C03"]}, "DEMO02-U0006": {"p": "P06", "q": "I do deliveries in a van, from early morning to late afternoon. I know the centre door by door.", "c": "Drives a delivery van through the centre all day.", "t": "TP01", "s": 0, "w": 19, "ts": 90, "codes": ["TH03.C03"]}, "DEMO02-U0007": {"p": "P01", "q": "Honestly, dangerous. There isn't a cycle lane that runs for more than two hundred metres.", "c": "Cycling into the centre is dangerous due to lack of cycle lanes.", "t": "TP02", "s": -2, "w": 15, "ts": 111, "codes": ["TH01.C01"]}, "DEMO02-U0008": {"p": "P01", "q": "Last week a driver opened his door right in front of me and I went over.", "c": "Fell off the bike after a driver opened a car door in front.", "t": "TP02", "s": -2, "w": 16, "ts": 111, "codes": ["TH01.C01"]}, "DEMO02-U0009": {"p": "P04", "q": "It's the same on foot. The pavements are full of parked cars. At my age I end up walking in the road.", "c": "Pavements blocked by parked cars force walking in the road.", "t": "TP02", "s": -2, "w": 22, "ts": 127, "codes": ["TH01.C01"]}, "DEMO02-U0010": {"p": "P02", "q": "I know, but I can't find anywhere to stop even to unload. I do three laps every morning.", "c": "Cannot find anywhere to stop and unload, circling three times each morning.", "t": "TP02", "s": -2, "w": 18, "ts": 137, "codes": ["TH01.C02"]}, "DEMO02-U0011": {"p": "P02", "q": "The council car park costs four euros an hour.", "c": "Council car park is expensive.", "t": "TP02", "s": -1, "w": 9, "ts": 137, "codes": ["TH01.C02"]}, "DEMO02-U0012": {"p": "P06", "q": "I double-park, I'll admit it. There are no loading bays, and the few there are get taken by private cars.", "c": "Double-parks because loading bays are missing or taken by private cars.", "t": "TP02", "s": -2, "w": 21, "ts": 151, "codes": ["TH01.C02"]}, "DEMO02-U0013": {"p": "P06", "q": "I've had two tickets this month.", "c": "Received two parking tickets this month.", "t": "TP02", "s": -1, "w": 6, "ts": 151, "codes": ["TH01.C02"]}, "DEMO02-U0014": {"p": "P05", "q": "The bus sits in the same traffic as everyone else. Yesterday it took me forty minutes to go three kilometres. I'd have been faster walking.", "c": "Bus is stuck in traffic and a short trip took forty minutes.", "t": "TP02", "s": -2, "w": 25, "ts": 164, "codes": ["TH01.C03"]}, "DEMO02-U0015": {"p": "P03", "q": "At night it's a different city, though. Empty streets, but empty bus stops too. The last bus leaves at half ten and my shift ends at eleven.", "c": "At night there are no buses; last bus leaves before shift ends.", "t": "TP02", "s": -2, "w": 27, "ts": 175, "codes": ["TH01.C03"]}, "DEMO02-U0016": {"p": "P01", "q": "Finally. Every city that's done it has never gone back. It would be the best decision this place has made in twenty years.", "c": "Strongly welcomes closing the centre, calling it the best decision in twenty years.", "t": "TP03", "s": 2, "w": 23, "ts": 201, "codes": ["OTHER"]}, "DEMO02-U0017": {"p": "P02", "q": "For me it's the beginning of the end for the shops.", "c": "Believes closure will begin the end of shops.", "t": "TP03", "s": -2, "w": 11, "ts": 210, "codes": ["TH02.C01"]}, "DEMO02-U0018": {"p": "P02", "q": "People who come by car will go to the out-of-town shopping centre, where parking is free.", "c": "Car customers will shift to the out-of-town shopping centre with free parking.", "t": "TP03", "s": -1, "w": 18, "ts": 210, "codes": ["TH02.C01"]}, "DEMO02-U0019": {"p": "P01", "q": "{P02}, the evidence from other cities says the opposite. People on foot spend more, because they stop, they sit down, they come back.", "c": "Evidence elsewhere shows pedestrians spend more and return.", "t": "TP03", "s": 1, "w": 23, "ts": 223, "codes": ["TH02.C02"]}, "DEMO02-U0020": {"p": "P02", "q": "Maybe in Amsterdam. Here my customer is also the man from the village who brings his wife to the doctor and then sits down for a coffee.", "c": "Other cities differ; local customers come by car from villages.", "t": "TP03", "s": -1, "w": 27, "ts": 232, "codes": ["TH02.C03", "TH03.C01"]}, "DEMO02-U0021": {"p": "P04", "q": "I'm in favour, but on one condition: that I can still get to the doctor and the market.", "c": "Supports closure on condition of access to doctor and market.", "t": "TP03", "s": 1, "w": 18, "ts": 243, "codes": ["TH03.C01"]}, "DEMO02-U0022": {"p": "P04", "q": "If they close the streets and don't put on a shuttle, older people will just stay at home.", "c": "Without a shuttle, older people will be stuck at home.", "t": "TP03", "s": -1, "w": 18, "ts": 243, "codes": ["TH03.C01", "TH05.C02"]}, "DEMO02-U0023": {"p": "P05", "q": "I agree with {P04}. Yes, but public transport first.", "c": "Agrees with condition; public transport must be improved first.", "t": "TP03", "s": 0, "w": 9, "ts": 257, "codes": ["TH06.C01"]}, "DEMO02-U0024": {"p": "P05", "q": "If you close the centre with the buses we have now, you're just punishing the people who have no alternative.", "c": "Closing with current buses punishes people without alternatives.", "t": "TP03", "s": -2, "w": 20, "ts": 257, "codes": ["TH03.C05", "TH06.C01"]}, "DEMO02-U0025": {"p": "P03", "q": "It worries me a bit. I'm not against it, but how do I get to my shift at six in the morning? The hospital is right on the edge of the centre.", "c": "Worried about reaching early shift at the hospital if centre closes.", "t": "TP03", "s": -1, "w": 32, "ts": 269, "codes": ["TH03.C02"]}, "DEMO02-U0026": {"p": "P06", "q": "And what do I do, carry the boxes on my shoulder? [laughter] Seriously, without delivery hours it doesn't work.", "c": "Closure without delivery hours is unworkable for deliveries.", "t": "TP03", "s": -2, "w": 18, "ts": 281, "codes": ["TH03.C03", "TH04.C01"]}, "DEMO02-U0027": {"p": "P01", "q": "But nobody's saying deliveries can't come in. All those cities have delivery hours, early in the morning.", "c": "Other cities allow deliveries in early-morning hours, so deliveries are not banned.", "t": "TP03", "s": 1, "w": 17, "ts": 292, "codes": ["TH04.C01"]}, "DEMO02-U0028": {"p": "P06", "q": "If it's six to eleven, fine, I can organise around that. If it's six to nine, no.", "c": "Accepts delivery hours if they run six to eleven but rejects six to nine.", "t": "TP03", "s": 0, "w": 17, "ts": 300, "codes": ["TH04.C01"]}, "DEMO02-U0029": {"p": "P02", "q": "We saw it last August when the street was closed for roadworks. Takings fell by almost half for two months.", "c": "Takings fell by almost half for two months when the street was closed for roadworks last August.", "t": "TP04", "s": -2, "w": 20, "ts": 315, "codes": ["TH02.C01"]}, "DEMO02-U0030": {"p": "P02", "q": "The fixed costs stay the same: rent, electricity, wages.", "c": "Fixed costs such as rent, electricity and wages continue regardless of lost takings.", "t": "TP04", "s": -1, "w": 9, "ts": 315, "codes": ["TH02.C04"]}, "DEMO02-U0031": {"p": "P05", "q": "But that was a building site, with dust and fencing. It's not the same as a nice pedestrian street with trees.", "c": "Argues roadworks are not comparable to a pleasant pedestrian street.", "t": "TP04", "s": 1, "w": 21, "ts": 330, "codes": ["TH02.C02"]}, "DEMO02-U0032": {"p": "P02", "q": "The pedestrian street with the trees will take three years to build.", "c": "Notes the pedestrian street will take three years to build.", "t": "TP04", "s": -1, "w": 12, "ts": 338, "codes": ["TH02.C04"]}, "DEMO02-U0033": {"p": "P02", "q": "Who pays me in the meantime?", "c": "Asks who will compensate shops during construction.", "t": "TP04", "s": -1, "w": 6, "ts": 338, "codes": ["TH02.C04"]}, "DEMO02-U0034": {"p": "P04", "q": "{P02} has a point there. The council has to help the shops through the transition, with lower business rates or something like that.", "c": "Agrees shops have a point and says the council should help through the transition, for example with lower business rates.", "t": "TP04", "s": 1, "w": 23, "ts": 346, "codes": ["TH02.C04"]}, "DEMO02-U0035": {"p": "P01", "q": "I agree with that. Support during the transition, yes.", "c": "Agrees with support for shops during the transition.", "t": "TP04", "s": 1, "w": 9, "ts": 357, "codes": ["TH02.C04"]}, "DEMO02-U0036": {"p": "P01", "q": "But not never doing it because someone is afraid.", "c": "Thinks the plan should not be abandoned because of fear.", "t": "TP04", "s": -1, "w": 9, "ts": 357, "codes": ["TH06.C02"]}, "DEMO02-U0037": {"p": "P03", "q": "And who decides which shop lost money because of the pedestrian street and which because of prices going up? It'll be another scheme nobody ever gets.", "c": "Doubts compensation could be fairly assigned and expects a scheme nobody receives.", "t": "TP04", "s": -2, "w": 26, "ts": 365, "codes": ["TH02.C04", "TH08.C01"]}, "DEMO02-U0038": {"p": "P04", "q": "Older people and people with disabilities.", "c": "Thinks older people and people with disabilities would struggle most.", "t": "TP05", "s": -1, "w": 6, "ts": 383, "codes": ["TH03.C01"]}, "DEMO02-U0039": {"p": "P04", "q": "My wife uses a wheelchair. A taxi has to be able to drop us at the door.", "c": "Spouse uses a wheelchair and taxis must be able to drop them at the door.", "t": "TP05", "s": -1, "w": 17, "ts": 383, "codes": ["TH03.C01"]}, "DEMO02-U0040": {"p": "P03", "q": "Shift workers. Hospitals, bakeries, cleaners. Not the whole city goes to sleep at ten.", "c": "Thinks shift workers would struggle most since many work at night.", "t": "TP05", "s": -1, "w": 14, "ts": 395, "codes": ["TH03.C02"]}, "DEMO02-U0041": {"p": "P06", "q": "Tradespeople who work out of a vehicle. Plumbers, electricians, us drivers. You can't carry a ladder on a bike.", "c": "Thinks tradespeople and drivers who work from vehicles would struggle most.", "t": "TP05", "s": -1, "w": 19, "ts": 404, "codes": ["TH03.C03"]}, "DEMO02-U0042": {"p": "P05", "q": "I'd also say the people living in the neighbourhoods around the centre, because every car will go and park there. My street will turn into a car park.", "c": "Thinks residents of surrounding neighbourhoods would struggle as cars park there.", "t": "TP05", "s": -2, "w": 28, "ts": 414, "codes": ["TH03.C04"]}, "DEMO02-U0043": {"p": "P01", "q": "That's a real risk, I agree with {P05}. You need a parking plan for the surrounding streets, otherwise you just move the problem.", "c": "Agrees on the risk and calls for a parking plan for surrounding streets.", "t": "TP05", "s": -1, "w": 23, "ts": 426, "codes": ["TH03.C04"]}, "DEMO02-U0044": {"p": "P02", "q": "And the schools. Parents dropping children off in the morning, where are they meant to stop?", "c": "Asks where parents can stop to drop children at schools.", "t": "TP05", "s": -1, "w": 16, "ts": 437, "codes": ["TH01.C02"]}, "DEMO02-U0045": {"p": "P05", "q": "Buses. Frequent, reliable, and running late. With bus lanes that people actually respect. That first, and then everything else.", "c": "Wants frequent, reliable, late-running buses with respected bus lanes as first priority.", "t": "TP06", "s": 0, "w": 19, "ts": 449, "codes": ["TH05.C01", "TH06.C01"]}, "DEMO02-U0046": {"p": "P03", "q": "A night bus to the hospital. If there's a bus at eleven at night and at seven in the morning, I'll leave the car at home tomorrow.", "c": "Wants a night bus to the hospital and would then leave the car at home.", "t": "TP06", "s": 1, "w": 27, "ts": 460, "codes": ["TH05.C01"]}, "DEMO02-U0047": {"p": "P04", "q": "A small electric shuttle that loops round the centre and stops wherever you wave it down.", "c": "Proposes a small electric hail-anywhere shuttle looping round the centre.", "t": "TP06", "s": 1, "w": 16, "ts": 469, "codes": ["TH05.C02"]}, "DEMO02-U0048": {"p": "P04", "q": "We used to have one and they scrapped it.", "c": "Such a shuttle existed before and was scrapped.", "t": "TP06", "s": -1, "w": 9, "ts": 469, "codes": ["TH05.C02", "TH08.C01"]}, "DEMO02-U0049": {"p": "P01", "q": "Cycle lanes that actually connect to each other. And bike parking.", "c": "Wants connected cycle lanes and bike parking.", "t": "TP06", "s": 0, "w": 11, "ts": 480, "codes": ["TH05.C04"]}, "DEMO02-U0050": {"p": "P01", "q": "Right now we lock them to lampposts.", "c": "Currently bikes are locked to lampposts.", "t": "TP06", "s": -1, "w": 7, "ts": 480, "codes": ["TH01.C01"]}, "DEMO02-U0051": {"p": "P02", "q": "Park-and-ride at the edge of town, cheap or free, with a bus that brings you into the centre.", "c": "Proposes cheap or free park-and-ride with a bus into the centre.", "t": "TP06", "s": 1, "w": 20, "ts": 488, "codes": ["TH05.C03"]}, "DEMO02-U0052": {"p": "P02", "q": "If they do that, I'm willing to talk.", "c": "Willing to discuss the closure if park-and-ride is provided.", "t": "TP06", "s": 1, "w": 8, "ts": 488, "codes": ["TH05.C03", "TH06.C01"]}, "DEMO02-U0053": {"p": "P06", "q": "Loading bays that are enforced. And a depot at the edge of the centre, where we drop the parcels and someone takes them in on an electric cargo bike.", "c": "Proposes enforced loading bays and an edge depot with electric cargo bike delivery.", "t": "TP06", "s": 1, "w": 29, "ts": 499, "codes": ["TH04.C02", "TH04.C03"]}, "DEMO02-U0054": {"p": "P01", "q": "The cargo bike thing is everywhere in Europe now. Good idea, {P06}.", "c": "Says cargo bike delivery is widespread in Europe and praises the idea.", "t": "TP06", "s": 2, "w": 12, "ts": 511, "codes": ["TH02.C03", "TH04.C03"]}, "DEMO02-U0055": {"p": "P06", "q": "Yes, but who pays for it? If it lands on us small operators, we'll go under.", "c": "Asks who pays and fears small operators would go under if costs fall on them.", "t": "TP06", "s": -2, "w": 16, "ts": 517, "codes": ["TH04.C04"]}, "DEMO02-U0056": {"p": "P01", "q": "Number one. But if I'm being realistic, number three as a first step, so people can see what it's like.", "c": "Prefers full pedestrianisation but accepts a pilot closure as a realistic first step.", "t": "TP07", "s": 1, "w": 20, "ts": 549, "codes": ["TH06.C03"]}, "DEMO02-U0057": {"p": "P05", "q": "Number four, no question. Then number one.", "c": "Picks public transport upgrade first, then full pedestrianisation.", "t": "TP07", "s": 1, "w": 7, "ts": 558, "codes": ["TH06.C01"]}, "DEMO02-U0058": {"p": "P02", "q": "Number three. On Sundays I might even come out ahead, families come in for a stroll. Weekdays, no.", "c": "Picks the pilot closure, expecting Sunday business gains but rejecting weekday closures.", "t": "TP07", "s": 1, "w": 18, "ts": 563, "codes": ["TH02.C02", "TH06.C03"]}, "DEMO02-U0059": {"p": "P04", "q": "Number three for me too. Let's try it before we make it permanent.", "c": "Picks the pilot closure so it can be tried before becoming permanent.", "t": "TP07", "s": 1, "w": 13, "ts": 573, "codes": ["TH06.C03"]}, "DEMO02-U0060": {"p": "P04", "q": "They once made the one-way system permanent overnight and we're still lost.", "c": "Recalls the one-way system made permanent overnight, still causing confusion.", "t": "TP07", "s": -1, "w": 13, "ts": 573, "codes": ["TH06.C03", "TH08.C01"]}, "DEMO02-U0061": {"p": "P03", "q": "Number four.", "c": "Picks upgrading public transport first.", "t": "TP07", "s": 1, "w": 2, "ts": 584, "codes": ["TH06.C01"]}, "DEMO02-U0062": {"p": "P03", "q": "And the charge, number two, I'm completely against. It'll be the nurse and the plumber who pay, not the person with the expensive car.", "c": "Strongly opposes the charging zone as it would burden workers rather than wealthy drivers.", "t": "TP07", "s": -2, "w": 24, "ts": 584, "codes": ["TH07.C01"]}, "DEMO02-U0063": {"p": "P01", "q": "But the charge raises money for the buses you're all asking for. It has to come from somewhere.", "c": "Argues the charge funds the buses others want and funding must come from somewhere.", "t": "TP07", "s": 1, "w": 18, "ts": 595, "codes": ["TH07.C02"]}, "DEMO02-U0064": {"p": "P03", "q": "Then exempt shift workers and work vehicles. Otherwise it's unfair.", "c": "Proposes exempting shift workers and work vehicles from the charge, otherwise unfair.", "t": "TP07", "s": -1, "w": 10, "ts": 602, "codes": ["TH07.C01", "TH07.C03"]}, "DEMO02-U0065": {"p": "P06", "q": "I agree with {P03}. The charge is a tax on people who work with a car. Number two, never.", "c": "Agrees the charge unfairly taxes people who work with a car and rejects it outright.", "t": "TP07", "s": -2, "w": 19, "ts": 609, "codes": ["TH07.C01"]}, "DEMO02-U0066": {"p": "P06", "q": "Number three works for me, as long as Sundays don't have deliveries.", "c": "Accepts the pilot closure provided there are no Sunday deliveries.", "t": "TP07", "s": 1, "w": 12, "ts": 609, "codes": ["TH04.C01", "TH06.C03"]}, "DEMO02-U0067": {"p": "P05", "q": "The charge only makes sense if every cent goes to public transport and we can see it. Otherwise it'll end up somewhere else, like it always does.", "c": "Accepts the charge only if revenue visibly goes to public transport, fearing it will be diverted.", "t": "TP07", "s": -1, "w": 27, "ts": 621, "codes": ["TH07.C02", "TH08.C03"]}, "DEMO02-U0068": {"p": "P02", "q": "There I agree with the young lady. Nobody is going to believe the money will go to the buses.", "c": "Agrees and says nobody will believe the charge money will go to buses.", "t": "TP07", "s": -2, "w": 19, "ts": 630, "codes": ["TH07.C02"]}, "DEMO02-U0069": {"p": "P04", "q": "Not much. The square was being refurbished for four years.", "c": "Has little trust in the council, citing the four-year square refurbishment.", "t": "TP08", "s": -1, "w": 10, "ts": 649, "codes": ["TH08.C01"]}, "DEMO02-U0070": {"p": "P04", "q": "But if we never let them try, nothing will ever change.", "c": "Believes the council must be allowed to try for anything to change.", "t": "TP08", "s": 1, "w": 11, "ts": 649, "codes": ["TH06.C02", "TH08.C04"]}, "DEMO02-U0071": {"p": "P03", "q": "The council, no. The people in the neighbourhood, yes. If they ask us first, like today, it has a better chance.", "c": "Does not trust the council but trusts neighbours, and thinks consulting residents first improves chances.", "t": "TP08", "s": -1, "w": 21, "ts": 660, "codes": ["TH08.C04"]}, "DEMO02-U0072": {"p": "P02", "q": "Not at all. Every mayor brings in his own plan and the next one rips it out.", "c": "Does not trust the council because each mayor scraps the predecessor's plan.", "t": "TP08", "s": -2, "w": 17, "ts": 669, "codes": ["TH08.C01"]}, "DEMO02-U0073": {"p": "P01", "q": "I trust them a bit more than the others do, because the cycle lane on the seafront got built and it works. So they can, when they want to.", "c": "Trusts the council somewhat more because the seafront cycle lane was built and works.", "t": "TP08", "s": 1, "w": 29, "ts": 676, "codes": ["TH08.C02"]}, "DEMO02-U0074": {"p": "P05", "q": "They can do building projects. I don't know if they can make the buses run on time. That's a different thing.", "c": "Doubts the council can run buses on time despite its ability to deliver building projects.", "t": "TP08", "s": -1, "w": 21, "ts": 686, "codes": ["TH08.C02"]}, "DEMO02-U0075": {"p": "P06", "q": "I'll trust them when I see the loading bays enforced. Until then, it's just talk.", "c": "Will trust the council only once loading bays are enforced; until then it is just talk.", "t": "TP08", "s": -1, "w": 15, "ts": 695, "codes": ["TH04.C02", "TH08.C03"]}, "DEMO02-U0076": {"p": "P01", "q": "I'd cycle to work without being scared. I'd like to have a child one day and let them play in the square without chasing after them.", "c": "Imagines cycling safely and letting a future child play in the square freely.", "t": "TP09", "s": 2, "w": 26, "ts": 711, "codes": ["TH09.C01"]}, "DEMO02-U0077": {"p": "P04", "q": "Quiet. Hearing the church bells from my balcony again. And sitting on a bench without breathing exhaust fumes.", "c": "Imagines quiet, hearing church bells, and sitting on a bench without exhaust fumes.", "t": "TP09", "s": 2, "w": 18, "ts": 722, "codes": ["TH09.C01"]}, "DEMO02-U0078": {"p": "P02", "q": "If it works, tables outside, on the street that's a car park today.", "c": "Imagines outdoor tables on a street that is a car park today.", "t": "TP09", "s": 1, "w": 13, "ts": 731, "codes": ["TH09.C03"]}, "DEMO02-U0079": {"p": "P02", "q": "I'm not saying I can't see it. I'm saying I'm afraid of the transition.", "c": "Can see the benefits but fears the transition period.", "t": "TP09", "s": -1, "w": 14, "ts": 731, "codes": ["TH06.C01"]}, "DEMO02-U0080": {"p": "P05", "q": "Never needing to own a car. Friends who moved abroad say that's what they miss least about home: depending on a car.", "c": "Imagines not needing to own a car, as friends abroad say they miss car dependence least.", "t": "TP09", "s": 2, "w": 22, "ts": 742, "codes": ["TH09.C02"]}, "DEMO02-U0081": {"p": "P03", "q": "If I had a night bus, I'd sell the car.", "c": "Would sell the car if a night bus existed.", "t": "TP09", "s": 1, "w": 10, "ts": 755, "codes": ["TH05.C01", "TH09.C02"]}, "DEMO02-U0082": {"p": "P03", "q": "Do you know how much it costs me a year? Insurance, fuel, servicing.", "c": "Complains about the high yearly cost of owning a car.", "t": "TP09", "s": -2, "w": 13, "ts": 755, "codes": ["TH09.C02"]}, "DEMO02-U0083": {"p": "P06", "q": "I don't know. Maybe I'll be the one on the electric cargo bike [laughter]. If it pays, why not.", "c": "Unsure about the future, but could imagine using an electric cargo bike if it pays.", "t": "TP09", "s": 1, "w": 18, "ts": 764, "codes": ["TH04.C03"]}, "DEMO02-U0084": {"p": "P01", "q": "Residents-only parking in the surrounding streets, with a permit. Other cities already do it.", "c": "Proposes residents-only permit parking in surrounding streets, as other cities do.", "t": "TP10", "s": 1, "w": 15, "ts": 782, "codes": ["TH03.C04"]}, "DEMO02-U0085": {"p": "P02", "q": "Then where does my customer park? You're pushing him out of the centre and out of the neighbourhood.", "c": "Objects that customers would have nowhere to park and are being pushed out.", "t": "TP10", "s": -2, "w": 18, "ts": 789, "codes": ["TH03.C04"]}, "DEMO02-U0086": {"p": "P04", "q": "In the park-and-ride at the edge of town that you mentioned, {P02}. We can't have everything.", "c": "Suggests customers use the park-and-ride, since compromises are needed.", "t": "TP10", "s": 0, "w": 18, "ts": 796, "codes": ["TH05.C03"]}, "DEMO02-U0087": {"p": "P02", "q": "If they build it. If. In this town an \"if\" lasts ten years [laughter].", "c": "Doubts the park-and-ride will be built, since promises take ten years.", "t": "TP10", "s": -2, "w": 13, "ts": 803, "codes": ["TH08.C01"]}, "DEMO02-U0088": {"p": "P05", "q": "That's why I say start with public transport and the park-and-ride, and the closure comes after. The order matters.", "c": "Public transport and park-and-ride should come before the closure.", "t": "TP10", "s": 0, "w": 21, "ts": 811, "codes": ["TH05.C03", "TH06.C01"]}, "DEMO02-U0089": {"p": "P03", "q": "Yes, the order matters. If they close first and promise buses later, we'll be the ones paying the difference.", "c": "Agrees order matters; closing first would make residents pay the cost.", "t": "TP10", "s": -1, "w": 19, "ts": 821, "codes": ["TH06.C01"]}, "DEMO02-U0090": {"p": "P01", "q": "If we wait for everything to be perfect, it'll never happen. Some things have to happen in parallel.", "c": "Waiting for perfection means nothing happens; measures should run in parallel.", "t": "TP10", "s": 0, "w": 18, "ts": 829, "codes": ["TH06.C02"]}, "DEMO02-U0091": {"p": "P04", "q": "In parallel, but with dates. We need to know when the shuttle arrives and when the street closes.", "c": "Accepts parallel implementation if firm dates are set for shuttle and closure.", "t": "TP10", "s": 0, "w": 18, "ts": 837, "codes": ["TH05.C02", "TH06.C02", "TH08.C03"]}, "DEMO02-U0092": {"p": "P06", "q": "Delivery hours from six to eleven, enforced loading bays, and permits for work vehicles to come in for repairs by appointment.", "c": "Proposes delivery hours, enforced loading bays and appointment permits for work vehicles.", "t": "TP11", "s": 1, "w": 21, "ts": 852, "codes": ["TH04.C01", "TH04.C02", "TH07.C03"]}, "DEMO02-U0093": {"p": "P06", "q": "If I have those, I've no problem with the pedestrian zone.", "c": "Would accept the pedestrian zone if those conditions are met.", "t": "TP11", "s": 1, "w": 11, "ts": 852, "codes": ["TH08.C03"]}, "DEMO02-U0094": {"p": "P02", "q": "Same for supplying the shops. I can bring my stock in early, as long as I can get to the door.", "c": "Agrees; early deliveries work for shop supply if there is access to the door.", "t": "TP11", "s": 1, "w": 21, "ts": 867, "codes": ["TH04.C01"]}, "DEMO02-U0095": {"p": "P01", "q": "That's reasonable. Nobody wants to kill the shops. We want the centre to come alive.", "c": "Finds the delivery arrangements reasonable; goal is a lively centre, not hurting shops.", "t": "TP11", "s": 1, "w": 15, "ts": 877, "codes": ["TH09.C03"]}, "DEMO02-U0096": {"p": "P05", "q": "I understand it, but if you give everyone an exemption, in the end everyone drives in. A night bus is better than an exemption.", "c": "Understands the request but fears broad exemptions; prefers a night bus.", "t": "TP12", "s": -1, "w": 24, "ts": 892, "codes": ["TH05.C01", "TH07.C04"]}, "DEMO02-U0097": {"p": "P04", "q": "For nights, yes, let them in with a permit. Who's going to carry the nurse home at three in the morning?", "c": "Supports permits for night-time access, citing nurses getting home.", "t": "TP12", "s": 1, "w": 21, "ts": 902, "codes": ["TH03.C02", "TH07.C03"]}, "DEMO02-U0098": {"p": "P01", "q": "A temporary exemption, until there's a night bus. Not a permanent one.", "c": "Proposes a temporary exemption only until a night bus exists.", "t": "TP12", "s": 0, "w": 12, "ts": 910, "codes": ["TH07.C04"]}, "DEMO02-U0099": {"p": "P03", "q": "Temporary is enough for me, if the night bus really comes. I'll believe it when I see it.", "c": "Accepts a temporary exemption but is skeptical the night bus will arrive.", "t": "TP12", "s": -1, "w": 18, "ts": 916, "codes": ["TH07.C04", "TH08.C03"]}, "DEMO02-U0100": {"p": "P06", "q": "Put us on the exemption list too, to be fair.", "c": "Asks for delivery workers to be put on the exemption list too.", "t": "TP12", "s": 0, "w": 10, "ts": 924, "codes": ["TH07.C03"]}, "DEMO02-U0101": {"p": "P05", "q": "You already have the delivery hours, {P06}. You can't have the hours and an exemption.", "c": "Rejects double treatment: delivery hours and an exemption together.", "t": "TP12", "s": -1, "w": 15, "ts": 928, "codes": ["TH07.C04"]}, "DEMO02-U0102": {"p": "P06", "q": "Fine, I'll accept that. The delivery hours are enough, if everyone sticks to them.", "c": "Accepts delivery hours instead of an exemption, provided all comply.", "t": "TP12", "s": 1, "w": 14, "ts": 934, "codes": ["TH04.C01", "TH07.C04"]}, "DEMO02-U0103": {"p": "P04", "q": "Not at all. We older people walk more than anyone. We'd be the first to enjoy it, if they thought about us.", "c": "Rejects that older people are uninterested; they walk most and would benefit if considered.", "t": "TP13", "s": 1, "w": 22, "ts": 949, "codes": ["TH03.C05", "TH09.C03"]}, "DEMO02-U0104": {"p": "P02", "q": "My older customers are split. Some say \"finally, some peace\", others say \"how will I get there\".", "c": "Older customers are divided between welcoming peace and worrying about access.", "t": "TP13", "s": 0, "w": 17, "ts": 958, "codes": ["TH03.C01", "TH09.C01"]}, "DEMO02-U0105": {"p": "P05", "q": "I think the difference isn't young and old, it's who has an alternative and who doesn't.", "c": "Thinks the divide is about who has alternatives, not age.", "t": "TP13", "s": 0, "w": 16, "ts": 967, "codes": ["TH03.C05"]}, "DEMO02-U0106": {"p": "P01", "q": "What {P05} just said is the most sensible thing anyone's said today.", "c": "Praises the point about alternatives as the most sensible of the day.", "t": "TP13", "s": 2, "w": 12, "ts": 975, "codes": ["TH03.C05"]}, "DEMO02-U0107": {"p": "P03", "q": "I completely agree. I'm not against the pedestrian zone. I'm against being left with no option.", "c": "Agrees and says opposition is to having no alternative, not to the zone itself.", "t": "TP13", "s": -1, "w": 16, "ts": 980, "codes": ["TH03.C05"]}, "DEMO02-U0108": {"p": "P02", "q": "Seeing figures from a city like ours, not from abroad. And a pilot here, with takings measured. If takings don't fall, I'll back it.", "c": "Would back the zone given local figures and a pilot showing takings don't fall.", "t": "TP14", "s": 0, "w": 24, "ts": 996, "codes": ["TH02.C03"]}, "DEMO02-U0109": {"p": "P03", "q": "A night bus that stops at the hospital. That's all.", "c": "A night bus stopping at the hospital would change the view.", "t": "TP14", "s": 0, "w": 10, "ts": 1009, "codes": ["TH05.C01"]}, "DEMO02-U0110": {"p": "P06", "q": "Delivery hours written down, with enforcement. Not promises.", "c": "Wants written, enforced delivery hours rather than promises.", "t": "TP14", "s": -1, "w": 8, "ts": 1015, "codes": ["TH04.C01", "TH08.C03"]}, "DEMO02-U0111": {"p": "P01", "q": "For me, being shown that pedestrian streets empty the centre. I don't believe it will happen, but if I saw it, I'd think again.", "c": "Would reconsider only if shown that pedestrian streets empty the centre, which is not expected.", "t": "TP14", "s": 1, "w": 24, "ts": 1021, "codes": ["TH02.C01"]}, "DEMO02-U0112": {"p": "P04", "q": "If a taxi and an ambulance can't get to my door, I'd change my mind straight away.", "c": "Would change mind immediately if taxis and ambulances cannot reach the door.", "t": "TP14", "s": -1, "w": 17, "ts": 1031, "codes": ["TH03.C01"]}, "DEMO02-U0113": {"p": "P05", "q": "I won't change my mind that the buses have to come first. On the rest I'm open.", "c": "Firm that buses must come first, open on everything else.", "t": "TP14", "s": 0, "w": 17, "ts": 1039, "codes": ["TH05.C01", "TH06.C01"]}, "DEMO02-U0114": {"p": "P01", "q": "Don't be afraid. Start now, even with a pilot.", "c": "Urges the mayor to be bold and start now, even with a pilot.", "t": "TP15", "s": 1, "w": 9, "ts": 1055, "codes": ["TH06.C02", "TH06.C03"]}, "DEMO02-U0115": {"p": "P02", "q": "Park-and-ride and support for the shops first, then close whatever you like.", "c": "Wants park-and-ride and shop support before any closures.", "t": "TP15", "s": 0, "w": 14, "ts": 1060, "codes": ["TH02.C04", "TH05.C03", "TH06.C01"]}, "DEMO02-U0116": {"p": "P03", "q": "Think about the people who work nights. The city doesn't only exist in the daytime.", "c": "Asks the mayor to consider night workers, as the city is not only a daytime place.", "t": "TP15", "s": 0, "w": 15, "ts": 1067, "codes": ["TH03.C02"]}, "DEMO02-U0117": {"p": "P04", "q": "A shuttle for older people, and ask us before you change our streets.", "c": "Wants a shuttle for older people and consultation before street changes.", "t": "TP15", "s": 0, "w": 13, "ts": 1074, "codes": ["TH05.C02", "TH08.C04"]}, "DEMO02-U0118": {"p": "P05", "q": "Public transport first. Everything else is detail.", "c": "Public transport must come first; the rest is detail.", "t": "TP15", "s": 0, "w": 7, "ts": 1081, "codes": ["TH05.C01", "TH06.C01"]}, "DEMO02-U0119": {"p": "P06", "q": "Delivery hours and enforcement. And don't put the cost on small operators.", "c": "Wants delivery hours with enforcement and no cost burden on small operators.", "t": "TP15", "s": 0, "w": 12, "ts": 1086, "codes": ["TH04.C01", "TH04.C04", "TH08.C03"]}, "DEMO02-U0120": {"p": "P04", "q": "Trees. If they take the cars out, they should put in shade. In July you can't sit in the square.", "c": "Wants trees and shade added if cars are removed, as the square is unbearable in July.", "t": "TP16", "s": -1, "w": 20, "ts": 1099, "codes": ["TH05.C05"]}, "DEMO02-U0121": {"p": "P01", "q": "Yes, trees, I agree with {P04}. And drinking fountains.", "c": "Agrees on trees and adds drinking fountains.", "t": "TP16", "s": 1, "w": 9, "ts": 1107, "codes": ["TH05.C05"]}, "DEMO02-U0122": {"p": "P02", "q": "And keep it clean. If it becomes a pedestrian street and it's dirty, nobody will come.", "c": "Says the pedestrian street must be kept clean or nobody will come.", "t": "TP16", "s": -1, "w": 16, "ts": 1112, "codes": ["TH05.C05"]}}}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("data").textContent);
let LANG = D.meta.language || "el";
try { LANG = localStorage.getItem("qp-lang-" + D.meta.session_id) || LANG; } catch (e) {}

const I = {
  el: {
    title: s => `Ομάδα εστίασης ${s}`,
    subtitle: m => `Εκτέλεση ${m.run_id} · ${m.n_participants} συμμετέχοντες · ~${m.minutes}′ · ${m.n_turns} τροπές · ψευδωνυμοποιημένα δεδομένα`,
    k_part: "Συμμετέχοντες", k_units: "Αναλυτικές μονάδες", k_units_n: m => `από ${m.n_participant_turns} τροπές συμμετεχόντων`,
    k_code: "Θέματα / κωδικοί", k_code_n: "εγκεκριμένο κωδικολόγιο",
    k_prop: "Προτάσεις υπό συζήτηση", k_rel: "Συνέπεια κωδικοποίησης", k_rel_n: "κ μεταξύ 2 εκτελέσεων (όχι εγκυρότητα)",
    k_st: "Συνέπεια θέσεων", k_st_n: "κ σε σταθερή λίστα προτάσεων",
    k_q: "Αποσπάσματα μονάδων αυτολεξεί", k_q_n: v => `+ ${v.report_checked - v.report_failed}/${v.report_checked} έλεγχοι αποσπασμάτων στις εκθέσεις`,
    k_bal: "Ισορροπία ομιλίας", k_bal_n: "Gini μεριδίων λέξεων (0 = ίσο)",
    k_cost: "Κόστος API", k_cost_n: s => `~${Math.round(s/60)}′ αναμονή API`,

function moveTip(ev) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let cx = ev.clientX, cy = ev.clientY;
  if (cx == null && ev.target && ev.target.getBoundingClientRect) { const r = ev.target.getBoundingClientRect(); cx = r.right; cy = r.top; }
  let x = cx + pad, y = cy + pad;
  if (x + w > innerWidth - 8) x = cx - w - pad;
  if (y + h > innerHeight - 8) y = cy - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

const layers = {pt: true, tp: true, st: true};
let kgState = null, selected = null;
function buildGraph() {
  const nodes = [], links = [];
  D.themes.filter(x => x.id !== "OTHER").forEach(x => nodes.push({id: x.id, type: "theme", ref: x}));
  D.participants.forEach(p => nodes.push({id: p.id, type: "part", ref: p}));
  D.props.forEach(p => nodes.push({id: p.id, type: "prop", ref: p}));
  D.participants.forEach(p => Object.entries(p.themes).forEach(([th, n]) => { if (n > 0 && th !== "OTHER") links.push({source: p.id, target: th, kind: "pt", w: n}); }));
  D.props.forEach(p => p.themes.filter(th => th !== "OTHER").forEach(th => links.push({source: th, target: p.id, kind: "tp", w: 1})));
  D.props.forEach(p => Object.entries(p.stances).forEach(([pid, s]) => { if (s.stance !== "not_expressed") links.push({source: pid, target: p.id, kind: "st", stance: s.stance, w: 1}); }));
  return {nodes, links};
}
function renderRings() {
  const host = document.getElementById("kg"); host.replaceChildren();
  if (!kgState) kgState = {g: buildGraph()};
  const {g} = kgState;
  const W = host.clientWidth, H = Math.max(520, Math.min(700, W * 0.8)), cx = W / 2, cy = H / 2;
  const rOut = Math.max(150, Math.min(H / 2 - 36, W / 2 - 170)), rMid = rOut * 0.66, rIn = rOut * 0.33;
  const byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
  const themes = g.nodes.filter(n => n.type === "theme"), parts = g.nodes.filter(n => n.type === "part"), props = g.nodes.filter(n => n.type === "prop");
  themes.forEach((n, i) => { n.a = -Math.PI / 2 + i * 2 * Math.PI / themes.length; n.r = rOut; });
  parts.forEach((n, i) => { n.a = -Math.PI / 2 + Math.PI / parts.length + i * 2 * Math.PI / parts.length; n.r = rIn; });
  // propositions: ordered by the circular mean angle of their themes, then spaced evenly on the middle ring
  props.forEach(n => { const ts = n.ref.themes.map(t => byId[t]).filter(Boolean);
    const sx = d3.sum(ts, t => Math.cos(t.a)), sy = d3.sum(ts, t => Math.sin(t.a));
    n.target = ts.length ? Math.atan2(sy, sx) : 0; });
  const sorted = props.slice().sort((a, b) => ((a.target + 2.5 * Math.PI) % (2 * Math.PI)) - ((b.target + 2.5 * Math.PI) % (2 * Math.PI)));
  const off = sorted.length ? sorted[0].target - (-Math.PI / 2) : 0;
  sorted.forEach((n, i) => { n.a = -Math.PI / 2 + off * 0.0 + (i + 0.5) * 2 * Math.PI / sorted.length; n.r = rMid; });
  // rotate the ring so propositions sit as close as possible to their themes
  let best = 0, bestCost = Infinity;
  for (let k = 0; k < 72; k++) { const rot = k * 2 * Math.PI / 72;

// ------------------------------------------------------------------ knowledge wheel (hierarchical edge bundling)
let kgMode = "wheel";

function renderKG() {

}

function renderKGControls() {

  const md = document.getElementById("kg-mode"); md.replaceChildren();

  const ch = document.getElementById("kg-layers"); ch.replaceChildren();
  const defs = kgMode === "wheel" ? [["men", "l_men"], ["st", "l_st"], ["pc", "l_pc"]] : [["pt", "l_pt"], ["tp", "l_tp"], ["st", "l_st"]];
  defs.forEach(([k, key]) => {
    const on = kgMode === "wheel" ? wheel[k] : layers[k];
    const b = el("button", {class: "chip", "aria-pressed": on}, t(key));
    b.onclick = () => { if (kgMode === "wheel") wheel[k] = !wheel[k]; else layers[k] = !layers[k]; renderKG(); };
    ch.appendChild(b); });
  const sc = document.getElementById("kg-stances"); sc.replaceChildren();

  if (kgMode !== "wheel") return;
  ["support", "oppose", "mixed"].forEach(k => {
    const b = el("button", {class: "chip", "aria-pressed": wheel.stance[k]}); const sw = el("span");
    sw.style.cssText = `display:inline-block;width:12px;height:2px;background:${stanceColor(k)};margin:0 6px 3px 0;vertical-align:middle`;
    b.append(sw, document.createTextNode(t(k))); b.onclick = () => { wheel.stance[k] = !wheel.stance[k]; renderKG(); }; sc.appendChild(b); });
  const sel = el("select", {class: "chip", "aria-label": t("n_prop")});
  [["all", "f_all"], ["consensus", "cons"], ["contested", "cont"], ["insufficient_coverage", "insuf"], ["border", "f_border"]].forEach(([k, key]) => {
    const o = el("option", {value: k}, `${t("n_prop")}: ${t(key)}`); if (wheel.label === k) o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { wheel.label = sel.value; renderKG(); };

function renderWheel() {

    leaves: orphans.map(p => ({id: p.id, type: "prop", ref: p, g: "OTHER"}))});
  groups.push({id: "PART", kind: "part", ref: {label_el: t("participants_g"), label_en: t("participants_g")},

  const baseOp = e => e.kind === "men" ? 0.34 : e.kind === "st" ? 0.62 : 0.5;

  const rr = r0 - 9;

  // ---- matching (search) and fading (label filter)

  const leafText = l => l.type === "code" ? `${l.id} ${l.ref.label_el} ${l.ref.label_en}` : l.type === "prop" ? `${l.id} ${l.ref.statement_el} ${l.ref.statement_en || ""}` : l.id;
  const matches = l => !q || foldTxt(leafText(l)).includes(q);

  // ---- theme bands with curved labels

  const bands = g0.append("g").selectAll("g").data(groups).join("g").attr("class", "wheel-band");
  bands.append("path").attr("d", g => arc({startAngle: g.a0 + 0.004, endAngle: g.a1 - 0.004}))
    .attr("fill", (g, i) => g.kind === "part" ? css("--node-part") : css("--series-3")).attr("opacity", (g, i) => g.kind === "part" ? 0.9 : (i % 2 ? 0.55 : 0.95));
  bands.each(function (g, i) {

        .attr("fill", cons ? css("--text-primary") : cont ? css("--surface-1") : css("--none")).attr("stroke", cons || cont ? css("--text-primary") : css("--none-ink"))

    } else {
      s.selectAll("path.ring").data(d3.pie().sort(null).value(d => d.n)(stanceMix(l.id))).join("path").attr("class", "ring")
        .attr("d", ringArc).attr("fill", d => stanceColor(d.data.k));
      s.append("circle").attr("r", 10).attr("fill", css("--node-part")).attr("stroke", css("--surface-1")).attr("stroke-width", 2);
    }
    s.append("circle").attr("r", 13).attr("fill", "transparent");
    const txt = l.type === "code" ? trunc(lbl(l.ref), 30) : l.type === "prop" ? `${l.id}${l.ref.borderline.length ? "†" : ""} ${trunc(stmt(l.ref), 24)}` : l.id;
    s.append("text").attr("x", (left ? -1 : 1) * (l.type === "part" ? 22 : 14)).attr("dy", "0.35em").attr("text-anchor", left ? "end" : "start")
      .attr("transform", left ? "rotate(180)" : null)
      .style("font-size", l.type === "part" ? "14px" : "11px").style("font-weight", l.type === "part" ? 700 : 400)
      .style("fill", l.type === "code" ? css("--text-secondary") : l.type === "prop" ? css("--text-muted") : css("--text-primary")).text(txt);
  });
  // ---- centre summary

  const ct = center.append("text").attr("class", "center-title").attr("text-anchor", "middle").attr("y", -4);
  const cs = center.append("text").attr("class", "center-sub").attr("text-anchor", "middle").attr("y", 18);
  const cs2 = center.append("text").attr("class", "center-sub").attr("text-anchor", "middle").attr("y", 36);

    if (l.kind === "theme" || l.kind === "part") { const x = l.ref; return l.kind === "part" ? setCenter(t("participants_g"), `${D.meta.n_participants}`, "")

  const total = Object.fromEntries(themes.map(th => [th.id, 0]));
  units.forEach(u => new Set((u.codes || []).map(c => codeTheme[c]).filter(Boolean)).forEach(th => { total[th] += 1; }));

  if (mxFilter === "border") rows = rows.filter(p => p.borderline.length);
  else if (mxFilter !== "all") rows = rows.filter(p => p.label === mxFilter);
  const parts = D.participants.map(p => p.id);
  const W = Math.max(760, host.clientWidth), rowH = 26, cell = 22, top = 26;
  const colLabel = 34, colStmt = Math.max(260, W - colLabel - parts.length * (cell + 4) - 300);
  const xCells = colLabel + colStmt + 12, xBar = xCells + parts.length * (cell + 4) + 16, barW = 120, xLab = xBar + barW + 14;
  const H = top + rows.length * rowH + 8;
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H).attr("role", "img").attr("aria-label", t("mx_title"));
  parts.forEach((p, i) => svg.append("text").attr("x", xCells + i * (cell + 4) + cell / 2).attr("y", 14).attr("text-anchor", "middle").style("font-weight", 600).text(p));
  const g = svg.selectAll("g.r").data(rows).join("g").attr("class", "r").attr("transform", (d, i) => `translate(0,${top + i * rowH})`).style("cursor", "pointer");
  g.append("rect").attr("x", 0).attr("y", 0).attr("width", W).attr("height", rowH - 2).attr("fill", "transparent");
  g.append("text").attr("x", 0).attr("y", rowH / 2).attr("dy", "0.35em").style("font-weight", 600).style("fill", css("--text-primary")).text(d => d.id);
  g.append("text").attr("x", colLabel).attr("y", rowH / 2).attr("dy", "0.35em").style("fill", css("--text-primary"))
    .text(d => { const s = stmt(d), max = Math.floor(colStmt / 6.6); return s.length > max ? s.slice(0, max - 1) + "…" : s; });
  parts.forEach((p, i) => {
    const c = g.append("g").attr("transform", `translate(${xCells + i * (cell + 4)},${(rowH - 2 - cell) / 2})`);
    c.append("rect").attr("width", cell).attr("height", cell).attr("rx", 4).attr("fill", d => stanceColor((d.stances[p] || {}).stance || "not_expressed"));
    c.append("text").attr("x", cell / 2).attr("y", cell / 2).attr("dy", "0.35em").attr("text-anchor", "middle")
      .style("fill", d => { const s = (d.stances[p] || {}).stance || "not_expressed"; return s === "not_expressed" ? css("--none-ink") : "#ffffff"; })
      .style("font-weight", 700).text(d => stanceGlyph((d.stances[p] || {}).stance || "not_expressed"));
    c.on("pointerenter", (ev, d) => { const s = d.stances[p] || {stance: "not_expressed", evidence: []};
      const rows = [["tv", `${p} · ${t(s.stance)}`, stanceColor(s.stance)], ["tl", `${d.id}: ${stmt(d)}`]];
      if (s.why) rows.push(["", s.why]);
      (s.evidence || []).slice(0, 1).forEach(u => D.units[u] && rows.push(["tq", `«${D.units[u].q}»`]));
      showTip(ev, rows); }).on("pointermove", moveTip).on("pointerleave", hideTip);
  });
  // counts bar: support | mixed | oppose | not expressed (2px surface gaps)
  const segs = d => { const n = D.meta.n_participants; let x = 0; return ["n_support", "n_mixed", "n_oppose", "n_not_expressed"].map(k => {
      const w = barW * (d[k] || 0) / n; const s = {k, x, w}; x += w; return s; }); };
  const key2stance = {n_support: "support", n_mixed: "mixed", n_oppose: "oppose", n_not_expressed: "not_expressed"};
  g.each(function (d) {
    const gg = d3.select(this).append("g").attr("transform", `translate(${xBar},${(rowH - 2 - 10) / 2})`);
    segs(d).filter(s => s.w > 0).forEach(s => gg.append("rect").attr("x", s.x + 1).attr("width", Math.max(0, s.w - 2)).attr("height", 10).attr("rx", 2)
      .attr("fill", stanceColor(key2stance[s.k])));
  });
  g.append("text").attr("x", xLab).attr("y", rowH / 2).attr("dy", "0.35em").style("fill", css("--text-secondary"))
    .text(d => `${labelName(d.label)}${d.borderline.length ? " † " + t("border") : ""}`);
  g.on("click", (ev, d) => { selected = d.id; inspect("prop", d.id); kgMode === "wheel" ? renderWheel() : renderRings(); document.getElementById("inspector").scrollIntoView({behavior: "smooth", block: "nearest"}); });
  // legend + filters
  const lg = document.getElementById("mx-legend"); lg.replaceChildren();
  ["support", "mixed", "oppose", "not_expressed"].forEach(s => legendKey(lg, stanceColor(s), `${stanceGlyph(s)} ${t(s)}`, "rect"));
  const f = document.getElementById("mx-filters"); f.replaceChildren();
  [["all", "f_all"], ["consensus", "cons"], ["contested", "cont"], ["insufficient_coverage", "insuf"], ["border", "f_border"]].forEach(([k, key]) => {
    const b = el("button", {class: "chip", "aria-pressed": mxFilter === k}, t(key)); b.onclick = () => { mxFilter = k; renderMatrix(); }; f.appendChild(b); });
}

// ------------------------------------------------------------------ theme prevalence (dot plot, 3 measures, one axis)
function renderPrev() {
  const host = document.getElementById("prev"); host.replaceChildren();
  const rows = D.themes.slice().sort((a, b) => b.pct_units - a.pct_units);
  const W = host.clientWidth, left = Math.min(230, W * 0.42), right = 20, rowH = 30, top = 8, H = top + rows.length * rowH + 24;
  const x = d3.scaleLinear().domain([0, 1]).range([left, W - right]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  svg.append("g").selectAll("line").data(x.ticks(5)).join("line").attr("class", "gridline").attr("x1", x).attr("x2", x).attr("y1", top).attr("y2", H - 22);
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - 22})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.format(".0%")).tickSize(0)).call(g => g.select(".domain").remove());
  const ms = [["pct_participants", "--series-1", "m_part"], ["pct_units", "--series-2", "m_units"], ["pct_words", "--series-3", "m_words"]];
  const g = svg.selectAll("g.r").data(rows).join("g").attr("transform", (d, i) => `translate(0,${top + i * rowH + rowH / 2})`);
  g.append("text").attr("x", left - 10).attr("dy", "0.35em").attr("text-anchor", "end").style("fill", css("--text-primary"))
    .text(d => { const s = lbl(d); return s.length > 34 ? s.slice(0, 33) + "…" : s; });
  g.append("line").attr("x1", d => x(d3.min(ms, m => d[m[0]]))).attr("x2", d => x(d3.max(ms, m => d[m[0]]))).attr("stroke", css("--grid")).attr("stroke-width", 2);
  ms.forEach(([k, c], j) => g.append("circle").attr("cx", d => x(d[k])).attr("cy", (j - 1) * 3).attr("r", 5).attr("fill", css(c)).attr("stroke", css("--surface-1")).attr("stroke-width", 2));
  g.append("rect").attr("x", left).attr("y", -rowH / 2).attr("width", W - left - right).attr("height", rowH).attr("fill", "transparent")
    .on("pointerenter", (ev, d) => showTip(ev, [["tv", lbl(d)],
      ...ms.map(([k, c, n]) => ["", `${pct(d[k])}  ${t(n)}`, css(c)]), ["tl", `${d.n_participants}/${D.meta.n_participants} · ${d.n_units} ${t("units")}`]]))
    .on("pointermove", moveTip).on("pointerleave", hideTip);
  const lg = document.getElementById("pv-legend"); lg.replaceChildren(); ms.forEach(([, c, n]) => legendKey(lg, css(c), t(n)));
  table(document.getElementById("prev-table"), [[t("n_theme"), lbl], [t("m_part"), d => pct(d.pct_participants)], [t("m_units"), d => pct(d.pct_units)], [t("m_words"), d => pct(d.pct_words)], ["n", d => `${d.n_participants} / ${d.n_units}`]], rows);
}

// ------------------------------------------------------------------ sentiment (diverging axis, zero line)
function renderSent() {
  const host = document.getElementById("sent"); host.replaceChildren();
  const rows = D.themes.filter(d => d.mean_sentiment != null).slice().sort((a, b) => a.mean_sentiment - b.mean_sentiment);
  const W = host.clientWidth, left = Math.min(190, W * 0.45), right = 16, rowH = 30, top = 8, H = top + rows.length * rowH + 24;
  const x = d3.scaleLinear().domain([-2, 2]).range([left, W - right]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  svg.append("g").selectAll("line").data([-2, -1, 0, 1, 2]).join("line").attr("class", "gridline").attr("x1", x).attr("x2", x).attr("y1", top).attr("y2", H - 22)
    .attr("stroke-width", d => d === 0 ? 1.5 : 1).style("stroke", d => d === 0 ? css("--text-muted") : null);
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - 22})`).call(d3.axisBottom(x).tickValues([-2, -1, 0, 1, 2]).tickFormat(d => (d > 0 ? "+" : "") + d).tickSize(0)).call(g => g.select(".domain").remove());
  const g = svg.selectAll("g.r").data(rows).join("g").attr("transform", (d, i) => `translate(0,${top + i * rowH + rowH / 2})`);
  g.append("text").attr("x", left - 10).attr("dy", "0.35em").attr("text-anchor", "end").style("fill", css("--text-primary"))
    .text(d => { const s = lbl(d); return s.length > 28 ? s.slice(0, 27) + "…" : s; });
  g.append("line").attr("x1", x(0)).attr("x2", d => x(d.mean_sentiment)).attr("stroke", css("--grid")).attr("stroke-width", 2);
  g.append("circle").attr("cx", d => x(d.participant_weighted_mean)).attr("r", 6).attr("fill", "none").attr("stroke", css("--text-secondary")).attr("stroke-width", 2);
  g.append("circle").attr("cx", d => x(d.mean_sentiment)).attr("r", 5).attr("fill", css("--text-primary")).attr("stroke", css("--surface-1")).attr("stroke-width", 2);
  g.append("rect").attr("x", left).attr("y", -rowH / 2).attr("width", W - left - right).attr("height", rowH).attr("fill", "transparent")
    .on("pointerenter", (ev, d) => showTip(ev, [["tv", lbl(d)], ["", `${signed(d.mean_sentiment)}  ${t("s_unit")}`], ["", `${signed(d.participant_weighted_mean)}  ${t("s_part")}`]]))
    .on("pointermove", moveTip).on("pointerleave", hideTip);
  const lg = document.getElementById("se-legend"); lg.replaceChildren();
  legendKey(lg, css("--text-primary"), t("s_unit")); legendKey(lg, css("--text-secondary"), t("s_part"), "ring");
  table(document.getElementById("sent-table"), [[t("n_theme"), lbl], [t("s_unit"), d => signed(d.mean_sentiment)], [t("s_part"), d => signed(d.participant_weighted_mean)]], rows);
}

// ------------------------------------------------------------------ interaction network
const inShow = {agree: true, disagree: true, mixed: false, neutral: false};
function renderInter() {
  const host = document.getElementById("inter"); host.replaceChildren();
  const W = host.clientWidth, H = Math.min(420, Math.max(320, W * 0.75)), R = Math.min(W, H) / 2 - 46, cx = W / 2, cy = H / 2;
  const parts = D.participants.map(p => p.id);
  const P = Object.fromEntries(parts.map((p, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / parts.length; return [p, [cx + R * Math.cos(a), cy + R * Math.sin(a)]]; }));
  const kinds = [["agree", "n_agree", "--pos"], ["disagree", "n_disagree", "--neg"], ["mixed", "n_mixed", "--mixed"], ["neutral", "n_neutral", "--text-muted"]];
  const edges = [];
  D.interactions.forEach(r => kinds.forEach(([k, col, c]) => { if (inShow[k] && r[col] > 0 && P[r.from_id] && P[r.to_id]) edges.push({...r, k, n: r[col], c}); }));
  const maxN = d3.max(edges, e => e.n) || 1;
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H).attr("role", "img").attr("aria-label", t("in_title"));
  const defs = svg.append("defs");
  kinds.forEach(([k, , c]) => defs.append("marker").attr("id", "arr-" + k).attr("viewBox", "0 0 10 10").attr("refX", 9).attr("refY", 5)
    .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto-start-reverse").append("path").attr("d", "M0,0L10,5L0,10z").attr("fill", css(c)));
  const kIdx = {agree: 0, disagree: 1, mixed: 2, neutral: 3};
  svg.append("g").selectAll("path").data(edges).join("path").attr("fill", "none")
    .attr("stroke", e => css(e.c)).attr("stroke-width", e => 1 + 4 * e.n / maxN).attr("stroke-linecap", "round").attr("opacity", 0.8)
    .attr("marker-end", e => `url(#arr-${e.k})`)
    .attr("d", e => {
      const [x1, y1] = P[e.from_id], [x2, y2] = P[e.to_id], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const ux = dx / L, uy = dy / L, sx = x1 + ux * 22, sy = y1 + uy * 22, ex = x2 - ux * 24, ey = y2 - uy * 24;
      const bend = 0.18 + 0.12 * kIdx[e.k], mx = (sx + ex) / 2 - uy * L * bend, my = (sy + ey) / 2 + ux * L * bend;
      return `M${sx},${sy}Q${mx},${my} ${ex},${ey}`;
    })
    .on("pointerenter", (ev, e) => showTip(ev, [["tv", `${e.from_id} → ${e.to_id}`], ...kinds.map(([k, col, c]) => ["", `${e[col]}  ${t(k)}`, css(c)])]))
    .on("pointermove", moveTip).on("pointerleave", hideTip).style("cursor", "default");
  const n = svg.append("g").selectAll("g").data(parts).join("g").attr("transform", p => `translate(${P[p][0]},${P[p][1]})`);
  n.append("circle").attr("r", 18).attr("fill", css("--node-part")).attr("stroke", css("--surface-1")).attr("stroke-width", 2);
  n.append("text").attr("text-anchor", "middle").attr("dy", "0.35em").style("fill", css("--surface-1")).style("font-weight", 650).text(p => p);
  const f = document.getElementById("in-filters"); f.replaceChildren();
  kinds.forEach(([k, , c]) => { const b = el("button", {class: "chip", "aria-pressed": inShow[k]}); const sw = el("span"); sw.style.cssText = `display:inline-block;width:12px;height:2px;background:${css(c)};margin:0 6px 3px 0;vertical-align:middle`;
    b.append(sw, document.createTextNode(t(k))); b.onclick = () => { inShow[k] = !inShow[k]; renderInter(); }; f.appendChild(b); });
  table(document.getElementById("inter-table"), [["→", r => `${r.from_id} → ${r.to_id}`], [t("agree"), r => r.n_agree], [t("disagree"), r => r.n_disagree], [t("mixed"), r => r.n_mixed], [t("neutral"), r => r.n_neutral]],
    D.interactions.filter(r => r.n_total > 0));
}

// ------------------------------------------------------------------ speaking share (single series + equal-share rule)
function renderSpeak() {
  const host = document.getElementById("speak"); host.replaceChildren();
  const rows = D.participants.slice().sort((a, b) => b.pct_words_participants - a.pct_words_participants);
  const W = host.clientWidth, left = 46, right = 56, rowH = 34, top = 18, H = top + rows.length * rowH + 30;
  const max = Math.max(0.3, d3.max(rows, d => d.pct_words_participants) * 1.15);
  const x = d3.scaleLinear().domain([0, max]).range([left, W - right]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  svg.append("g").selectAll("line").data(x.ticks(4)).join("line").attr("class", "gridline").attr("x1", x).attr("x2", x).attr("y1", top).attr("y2", H - 24);
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - 24})`).call(d3.axisBottom(x).ticks(4).tickFormat(d3.format(".0%")).tickSize(0)).call(g => g.select(".domain").remove());
  const g = svg.selectAll("g.r").data(rows).join("g").attr("transform", (d, i) => `translate(0,${top + i * rowH})`);
  const bh = Math.min(20, rowH - 10);
  g.append("text").attr("x", left - 10).attr("y", bh / 2).attr("dy", "0.35em").attr("text-anchor", "end").style("fill", css("--text-primary")).style("font-weight", 600).text(d => d.id);
  g.append("path").attr("fill", css("--series-1")).attr("d", d => { const x0 = x(0), x1 = Math.max(x0 + 4, x(d.pct_words_participants)), r = 4;
    return `M${x0},0H${x1 - r}Q${x1},0 ${x1},${r}V${bh - r}Q${x1},${bh} ${x1 - r},${bh}H${x0}Z`; });
  const ext = d3.extent(rows, d => d.pct_words_participants);
  g.filter(d => d.pct_words_participants === ext[0] || d.pct_words_participants === ext[1]).append("text")
    .attr("x", d => x(d.pct_words_participants) + 6).attr("y", bh / 2).attr("dy", "0.35em").text(d => pct(d.pct_words_participants));
  g.append("rect").attr("x", left).attr("y", -4).attr("width", W - left - right).attr("height", rowH).attr("fill", "transparent")
    .on("pointerenter", (ev, d) => showTip(ev, [["tv", `${pct(d.pct_words_participants)}`], ["tl", `${d.id} · ${d.n_words} ${t("words")} · ${d.n_turns} ${t("turns")} · ${t("dominance")} ${fmt(d.dominance_ratio)}`]]))
    .on("pointermove", moveTip).on("pointerleave", hideTip);
  const eq = 1 / D.meta.n_participants;
  svg.append("line").attr("x1", x(eq)).attr("x2", x(eq)).attr("y1", top - 8).attr("y2", H - 24).attr("stroke", css("--text-secondary")).attr("stroke-width", 1.5);
  svg.append("text").attr("x", x(eq) + 4).attr("y", top - 6).style("font-size", "11px").text(`${t("equal")} ${pct(eq)}`);
  const note = el("div", {class: "note", style: "margin-top:4px"}, t("mod_share", pct(D.meta.moderator_pct_words_all)));
  host.appendChild(note);
  table(document.getElementById("speak-table"), [[t("n_part"), d => d.id], ["%", d => pct(d.pct_words_participants)], [t("words"), d => d.n_words], [t("turns"), d => d.n_turns], [t("units"), d => d.n_units], [t("dominance"), d => fmt(d.dominance_ratio)]], rows);
}

// ------------------------------------------------------------------ reliability (status bands with labels)
function renderRel() {
  const host = document.getElementById("rel"); host.replaceChildren();
  const rows = D.reliability.codes.filter(r => r.kappa != null);
  const W = host.clientWidth, left = 76, right = 16, rowH = 15, top = 22, H = top + rows.length * rowH + 26;
  const x = d3.scaleLinear().domain([0.5, 1]).range([left, W - right]).clamp(true);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  const bands = [[0.5, 0.667, "--band-crit", "b_low"], [0.667, 0.8, "--band-warn", "b_tent"], [0.8, 1, "--band-good", "b_good"]];
  bands.forEach(([a, b, c, k]) => { svg.append("rect").attr("x", x(a)).attr("y", top - 4).attr("width", x(b) - x(a)).attr("height", H - top - 22).attr("fill", css(c));
    svg.append("text").attr("x", (x(a) + x(b)) / 2).attr("y", 12).attr("text-anchor", "middle").style("font-size", "11px").text(t(k)); });
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - 22})`).call(d3.axisBottom(x).tickValues([0.5, 0.667, 0.8, 0.9, 1]).tickFormat(d => fmt(d, d === 0.667 ? 3 : 1)).tickSize(0)).call(g => g.select(".domain").remove());
  const g = svg.selectAll("g.r").data(rows).join("g").attr("transform", (d, i) => `translate(0,${top + i * rowH + rowH / 2})`);
  g.append("text").attr("x", left - 8).attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "10.5px").text(d => d.id);
  const unstable = d => String(d.unstable).toLowerCase() === "true";
  g.append("circle").attr("cx", d => x(d.kappa)).attr("r", 4.5)
    .attr("fill", d => unstable(d) ? css("--surface-1") : css("--text-primary")).attr("stroke", d => unstable(d) ? css("--text-secondary") : css("--surface-1")).attr("stroke-width", 2);
  g.append("rect").attr("x", left).attr("y", -rowH / 2).attr("width", W - left - right).attr("height", rowH).attr("fill", "transparent")
    .on("pointerenter", (ev, d) => showTip(ev, [["tv", `κ ${fmt(d.kappa, 3)}`], ["tl", `${d.id} · ${d.label_en || ""}`], ["tl", `A ${d.n_pos_A} · B ${d.n_pos_B}${unstable(d) ? " · " + t("unstable") : ""}`]]))
    .on("pointermove", moveTip).on("pointerleave", hideTip);
  const lg = document.getElementById("re-legend"); lg.replaceChildren();
  legendKey(lg, css("--text-primary"), "κ"); legendKey(lg, css("--text-secondary"), t("unstable"), "ring");
  table(document.getElementById("rel-table"), [[t("codes"), d => d.id], ["κ", d => fmt(d.kappa, 3)], ["A+", d => d.n_pos_A], ["B+", d => d.n_pos_B], ["", d => unstable(d) ? t("unstable") : d.band]], D.reliability.codes);
}

// ------------------------------------------------------------------ wiring
function renderAll() {
  renderHeader(); renderKPIs(); renderStory(); renderKG(); renderMatrix(); renderPrev(); renderSent(); renderInter(); renderSpeak(); renderRel();
  inspect(selected ? (themeById[selected] ? "theme" : partById[selected] ? "part" : codeById[selected] ? "code" : propById[selected] ? "prop" : null) : null, selected);
}
document.getElementById("lang-el").onclick = () => { LANG = "el"; try { localStorage.setItem("qp-lang-" + D.meta.session_id, LANG); } catch (e) {} renderAll(); };
document.getElementById("lang-en").onclick = () => { LANG = "en"; try { localStorage.setItem("qp-lang-" + D.meta.session_id, LANG); } catch (e) {} renderAll(); };
document.getElementById("theme-toggle").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; renderAll();
};
document.querySelectorAll(".tbl-toggle").forEach(b => b.onclick = () => {
  const tbl = document.getElementById(b.dataset.table + "-table"), ch = document.getElementById(b.dataset.table);
  tbl.classList.toggle("hidden"); ch.classList.toggle("hidden"); renderHeader();
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderAll, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
renderAll();
})();
</script>
